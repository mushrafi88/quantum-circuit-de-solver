[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qoqpinn"
version = "0.1.0"
description = "Quantum-circuit-based solution of ODEs and PDEs (Physics 610 course project)"
requires-python = ">=3.10"
dependencies = [
    "pennylane>=0.37,<=0.45.1",
    # jax 0.11 removed jax.core.is_concrete, which pennylane<=0.45 still calls.
    "jax>=0.4.20,<0.11",
    "jaxlib>=0.4.20,<0.11",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[tool.setuptools]
packages = ["qoqpinn"]
